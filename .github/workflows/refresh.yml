name: Refresh dashboard

on:
  schedule:
    - cron: "30 12 * * *"   # 7:30am Central (daylight time); 6:30am in winter
  workflow_dispatch:
    inputs:
      days:
        description: "Days to re-fetch"
        default: "7"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch from Garmin and build page
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          TZ_NAME: America/Chicago
        run: python run.py --days "${{ github.event.inputs.days || '7' }}"

      - name: Save encrypted history and refreshed tokens
        run: |
          git config user.name "recomp-bot"
          git config user.email "recomp-bot@users.noreply.github.com"
          git add data/history.enc data/tokens.enc
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%F)"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Password-protect the page (staticrypt, MIT)
        env:
          STATICRYPT_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          npx --yes staticrypt@3 site/index.html -d public --short --remember 30 \
            --template-title "Recomp Lab" --template-button "Open" \
            --template-color-primary "#18263A" --template-color-secondary "#EDF0EE"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
